<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen">
  </head>
  <body class="page">
    <header class="header page__header">
      <h1 class="header__title header__title_hidden">Eisenhower To-Do Matrix</h1>
      <figure class="matrix-scheme">
        <img class="matrix-scheme__img" src="./eisenhower-matrix.jpg" alt="The Eisenhower matrix scheme">
        <figcaption class="matrix-scheme__figcaption">
          <a class="matrix-scheme__caption" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
        </figcaption>
      </figure>
    </header>
    <main class="main-content page-content">
      <section class="add-task">
        <label class="add-task__label" for="new-task">Add Item</label>
        <div class="add-task__row">
          <input id="new-task" class="task-input add-task__input" type="text">
          <button class="button">Add</button>
        </div>
      </section>
      <section class="task-list">
        <h3 class="task-list__title">Todo</h3>
        <ul class="task-list__inner task-list__inner_incomplete" >
          <li class="task-list__item">
            <input class="task-list__checkbox" type="checkbox">
            <label class="task-list__label">Pay Bills</label>
            <input class="task-input task-list__input" type="text">
            <button class="button task-list__button task-list__button_edit">Edit</button>
            <button class="button task-list__button task-list__button_delete">
              <img class="button__icon" src="./remove.svg" alt="remove button">
            </button>
          </li>
          <li class="task-list__item task-list__item_edit-mode">
            <input class="task-list__checkbox" type="checkbox">
            <label class="task-list__label">Go Shopping</label>
            <input class="task-input task-list__input" type="text" value="Go Shopping">
            <button class="button task-list__button task-list__button_edit">Save</button>
            <button class="button task-list__button task-list__button_delete">
              <img class="button__icon" src="./remove.svg" alt="remove button">
            </button>
          </li>
        </ul>
      </section>
      <section class="task-list">
        <h3 class="task-list__title">Completed</h3>
        <ul class="task-list__inner task-list__inner_completed">
          <li class="task-list__item">
            <input class="task-list__checkbox" type="checkbox" checked>
            <label class="task-list__label">See the Doctor</label>
            <input class="task-input task-list__input" type="text">
            <button class="button task-list__button task-list__button_edit">Edit</button>
            <button class="button task-list__button task-list__button_delete">
              <img class="button__icon" src="./remove.svg" alt="remove button">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
